<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>OsBrawl 3D - Brawl Stars</title>
  
  <!-- Three.js (3D Motoru) & Socket.io & Nipple.js (Mobil Joystick) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: #0b0e14; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }

    /* Karakter Seçim & Lobi Ekranı */
    #ui-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(15, 23, 42, 0.95); z-index: 10;
    }
    .lobby-card {
      background: #1e293b; border: 3px solid #38bdf8; border-radius: 16px;
      padding: 24px; text-align: center; width: 90%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 { color: #facc15; font-size: 32px; margin-bottom: 15px; text-shadow: 2px 2px #000; }
    input {
      width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #475569;
      background: #0f172a; color: #fff; font-size: 16px; text-align: center; margin-bottom: 15px;
    }
    .brawler-select { display: flex; justify-content: space-around; margin-bottom: 20px; }
    .brawler-option {
      border: 2px solid #475569; border-radius: 10px; padding: 10px; cursor: pointer;
      background: #0f172a; width: 30%; font-weight: bold; transition: 0.2s;
    }
    .brawler-option.selected { border-color: #facc15; background: #334155; transform: scale(1.05); }
    .play-btn {
      width: 100%; padding: 14px; border: none; border-radius: 8px;
      background: #22c55e; color: #fff; font-size: 20px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 0 #15803d;
    }
    .play-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #15803d; }

    /* Mobil Controls (Joystick Alanı) */
    #joystick-zone {
      position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px;
      z-index: 5; display: none;
    }
  </style>
</head>
<body>

  <!-- LOBİ & KARAKTER SEÇİM EKRANI -->
  <div id="ui-overlay">
    <div class="lobby-card">
      <h1>OsBrawl 3D</h1>
      <input type="text" id="usernameInput" placeholder="Oyuncu Adı" maxlength="12">
      
      <p style="margin-bottom: 8px; color: #94a3b8;">Brawler Seç:</p>
      <div class="brawler-select">
        <div class="brawler-option selected" onclick="selectBrawler('Shelly', this)" style="color:#a855f7;">Shelly</div>
        <div class="brawler-option" onclick="selectBrawler('Colt', this)" style="color:#38bdf8;">Colt</div>
        <div class="brawler-option" onclick="selectBrawler('El Primo', this)" style="color:#ef4444;">El Primo</div>
      </div>

      <button class="play-btn" onclick="startGame()">OYUNA BAŞLA</button>
    </div>
  </div>

  <!-- Mobil Joystick Alanı -->
  <div id="joystick-zone"></div>

  <script>
    const socket = io();
    let selectedBrawler = 'Shelly';
    let myId = null;
    let myUsername = "";
    
    // Three.js Değişkenleri
    let scene, camera, renderer;
    let playerMeshes = {};
    let keys = {};
    let moveVector = { x: 0, z: 0 };

    function selectBrawler(name, el) {
      selectedBrawler = name;
      document.querySelectorAll('.brawler-option').forEach(opt => opt.classList.remove('selected'));
      el.classList.add('selected');
    }

    function init3D() {
      // Sahne Oluştur
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x10b981); // Brawl Stars Yeşil Çim Saha

      // Kamera (Brawl Stars İzometrik Açısı)
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 25, 18);
      camera.lookAt(0, 0, 0);

      // Işıklandırma
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight.position.set(10, 30, 10);
      scene.add(dirLight);

      // Arena Zemini
      const gridHelper = new THREE.GridHelper(50, 25, 0x059669, 0x047857);
      scene.add(gridHelper);

      // Render Motoru
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    // Brawler 3D Modeli (Karaktere göre renk değişir)
    function createBrawlerMesh(brawlerName) {
      const group = new THREE.Group();
      let color = 0xa855f7; // Shelly
      if (brawlerName === 'Colt') color = 0x38bdf8;
      if (brawlerName === 'El Primo') color = 0xef4444;

      // Gövde
      const bodyGeo = new THREE.CylinderGeometry(0.6, 0.6, 1.5, 16);
      const bodyMat = new THREE.MeshLambertMaterial({ color: color });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.75;
      group.add(body);

      // Göz/Yön Belirteci (Ön tarafını anlamak için)
      const eyeGeo = new THREE.BoxGeometry(0.4, 0.2, 0.3);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const eye = new THREE.Mesh(eyeGeo, eyeMat);
      eye.position.set(0, 1.1, -0.5);
      group.add(eye);

      return group;
    }

    function setupJoystick() {
      document.getElementById('joystick-zone').style.display = 'block';
      const manager = nipplejs.create({
        zone: document.getElementById('joystick-zone'),
        mode: 'static',
        position: { left: '60px', bottom: '60px' },
        color: 'white'
      });

      manager.on('move', (evt, data) => {
        if (data.vector) {
          moveVector.x = data.vector.x;
          moveVector.z = -data.vector.y;
        }
      });

      manager.on('end', () => {
        moveVector.x = 0;
        moveVector.z = 0;
      });
    }

    function startGame() {
      myUsername = document.getElementById('usernameInput').value.trim();
      if (!myUsername) return alert("Lütfen bir kullanıcı adı girin!");

      document.getElementById('ui-overlay').style.display = 'none';

      init3D();
      setupJoystick();

      socket.emit('joinGame', { username: myUsername, brawler: selectedBrawler });
      
      // Klavye Dinleyicileri (PC için)
      window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
      window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

      animate();
    }

    // Socket Olayları
    socket.on('connect', () => { myId = socket.id; });

    socket.on('currentPlayers', (serverPlayers) => {
      for (let id in serverPlayers) {
        if (!playerMeshes[id]) addPlayerToScene(serverPlayers[id]);
      }
    });

    socket.on('newPlayer', (player) => {
      if (!playerMeshes[player.id]) addPlayerToScene(player);
    });

    socket.on('playerMoved', (player) => {
      if (playerMeshes[player.id]) {
        playerMeshes[player.id].position.x = player.x;
        playerMeshes[player.id].position.z = player.z;
        playerMeshes[player.id].rotation.y = player.rotation;
      }
    });

    socket.on('playerDisconnected', (id) => {
      if (playerMeshes[id]) {
        scene.remove(playerMeshes[id]);
        delete playerMeshes[id];
      }
    });

    function addPlayerToScene(player) {
      const mesh = createBrawlerMesh(player.brawler);
      mesh.position.set(player.x, 0, player.z);
      scene.add(mesh);
      playerMeshes[player.id] = mesh;
    }

    function updateLogic() {
      if (myId && playerMeshes[myId]) {
        let speed = 0.15;
        let dx = 0, dz = 0;

        // PC Klavye Kontrolü
        if (keys['a'] || keys['arrowleft']) dx -= speed;
        if (keys['d'] || keys['arrowright']) dx += speed;
        if (keys['w'] || keys['arrowup']) dz -= speed;
        if (keys['s'] || keys['arrowdown']) dz += speed;

        // Mobil Joystick Kontrolü
        if (moveVector.x !== 0 || moveVector.z !== 0) {
          dx = moveVector.x * speed;
          dz = moveVector.z * speed;
        }

        if (dx !== 0 || dz !== 0) {
          const myMesh = playerMeshes[myId];
          myMesh.position.x += dx;
          myMesh.position.z += dz;
          
          // Yön Açısını Hesapla
          const angle = Math.atan2(-dx, -dz);
          myMesh.rotation.y = angle;

          // Kamerayı Oyuncuyu Takip Edecek Şekilde Kaydır
          camera.position.x = myMesh.position.x;
          camera.position.z = myMesh.position.z + 18;

          // Sunucuya Hareket Bilgisini Gönder
          socket.emit('playerMovement', {
            x: myMesh.position.x,
            z: myMesh.position.z,
            rotation: myMesh.rotation.y
          });
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      updateLogic();
      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }
  </script>
</body>
</html>
